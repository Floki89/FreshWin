name: Bug report / Fehler melden
description: Something does not work as expected / Etwas funktioniert nicht wie erwartet
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FreshWin version
      description: Shown in the window title, e.g. 1.4.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "Win + R → winver, e.g. Windows 11 24H2 (26100)"
  - type: dropdown
    id: start
    attributes:
      label: How was FreshWin started? / Wie wurde FreshWin gestartet?
      options:
        - Double-click on FreshWin.bat
        - One-line command (irm … | iex)
        - With /auto or /config
  - type: textarea
    id: log
    attributes:
      label: Log file / Logdatei
      description: Paste the relevant part of FreshWin_<PC>_<date>.log (remove personal data)
      render: text
